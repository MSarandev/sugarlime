name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check the generated schema is current
        run: |
          go run ./cmd/gen-schema
          git diff --exit-code internal/schema/registry_gen.go

      - name: Check coverage, and that the README badge is honest
        run: |
          actual=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')
          badge=$(grep -o 'coverage-[0-9.]*%25' README.md | head -1 | sed 's/coverage-//; s/%25//')
          echo "measured ${actual}%, README badge ${badge}%"
          awk -v a="$actual" 'BEGIN { if (a < 85) { print "::error::coverage " a "% is below the 85% floor"; exit 1 } }'
          awk -v a="$actual" -v b="$badge" 'BEGIN { if (b > a + 0.5) { print "::error::the README badge claims " b "%, but coverage is " a "%"; exit 1 } }' 
